{% comment %}
One member's tile. Checked-in members get a separate small "undo" button
rather than turning the whole tile into a toggle, so tapping the wrong name
can never silently remove someone who is already checked in.
{% endcomment %}
<div class="col-6 col-lg-4" id="member-btn-{{ member.id }}"
     data-member-name="{{ member.first_name }} {{ member.last_name }}">
    <div class="btn-group w-100" role="group">
        <button
            class="btn py-3 {% if is_present %}btn-success{% else %}btn-outline-secondary{% endif %}"
            {% if kiosk_open %}
            hx-post="{% url 'checkin_member' meeting.id member.id %}"
            hx-target="#member-btn-{{ member.id }}"
            hx-swap="outerHTML"
            hx-disabled-elt="this"
            hx-sync="this:drop"
            {% else %}disabled{% endif %}
        >
            <span class="fw-bold">{{ member.first_name }} {{ member.last_name }}</span>
            {% if is_present %} ✓{% endif %}
            {% if member.attendance_mode is not None %}
                <span class="badge rounded-pill {% if member.attendance_mode %}bg-success{% else %}bg-secondary{% endif %} ms-1">{% if member.attendance_mode %}In Person{% else %}Remote{% endif %}</span>
            {% endif %}
        </button>
        {% if is_present and kiosk_open %}
            <button
                class="btn btn-success border-start flex-grow-0 px-3"
                title="Undo check-in for {{ member.first_name }} {{ member.last_name }}"
                aria-label="Undo check-in for {{ member.first_name }} {{ member.last_name }}"
                hx-post="{% url 'undo_checkin_member' meeting.id member.id %}"
                hx-target="#member-btn-{{ member.id }}"
                hx-swap="outerHTML"
                hx-disabled-elt="this"
                hx-sync="this:drop"
            >&times;</button>
        {% endif %}
    </div>
</div>
